worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;

  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

  upstream backend_api { server backend-api:8000; keepalive 16; }
  upstream order_service { server order-service:8000; keepalive 16; }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;

    location = /health { access_log off; return 200 "ok\n"; }
    location /api/v1/auth/ { limit_req zone=auth burst=10 nodelay; proxy_pass http://backend_api; include /etc/nginx/proxy_params; }
    location /api/v1/orders { limit_req zone=general burst=20 nodelay; proxy_pass http://order_service; include /etc/nginx/proxy_params; }
    location /api/v1/ { limit_req zone=general burst=30 nodelay; proxy_pass http://backend_api; include /etc/nginx/proxy_params; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
