name: ecommerce-phase1

x-app-environment: &app-environment
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DATABASE_URL: mysql+pymysql://ecommerce:${MYSQL_PASSWORD:-local-db-password}@mysql:3306/ecommerce
  JWT_SECRET: ${JWT_SECRET:-local-only-jwt-secret-change-before-production-000000000000}
  JWT_ISSUER: ecommerce-backend
  JWT_AUDIENCE: ecommerce
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-only-internal-token-change-before-production-000000}
  OBJECT_STORAGE_ENDPOINT: http://object-storage:9000
  OBJECT_STORAGE_REGION: us-east-1
  OBJECT_STORAGE_BUCKET: ecommerce
  OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-local-access-key}
  OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-local-secret-key-change-me}
  AUTO_CREATE_SCHEMA: "true"

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-db-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [data]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-local-redis-password}", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-local-redis-password}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [data]
    restart: unless-stopped

  object-storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-local-access-key}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-local-secret-key-change-me}
    volumes:
      - object_storage_data:/data
    networks: [data]
    restart: unless-stopped

  object-storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [object-storage]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://object-storage:9000 "$${OBJECT_STORAGE_ACCESS_KEY}" "$${OBJECT_STORAGE_SECRET_KEY}"; do sleep 2; done;
        mc mb --ignore-existing local/ecommerce;
        mc version enable local/ecommerce
    environment:
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-local-access-key}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-local-secret-key-change-me}
    networks: [data]
    restart: "no"

  backend-api:
    build: ./services/backend-api
    environment:
      <<: *app-environment
      REDIS_URL: redis://:${REDIS_PASSWORD:-local-redis-password}@redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      object-storage-init: {condition: service_completed_successfully}
    networks: [application, data]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  order-service:
    build: ./services/order-api
    environment:
      <<: *app-environment
      BACKEND_URL: http://backend-api:8000
    depends_on:
      mysql: {condition: service_healthy}
      backend-api: {condition: service_healthy}
    networks: [application, data]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      backend-api: {condition: service_healthy}
      order-service: {condition: service_healthy}
    networks: [application]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  object_storage_data:

networks:
  application:
    internal: true
  data:
    internal: true
