apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
type: Opaque
stringData:
  DATABASE_URL: mysql+pymysql://user:password@rds.internal:3306/ecommerce
  REDIS_URL: redis://:password@dcs.internal:6379/0
  JWT_SECRET: replace-with-at-least-32-random-characters
  INTERNAL_SERVICE_TOKEN: replace-with-another-32-character-random-value
  OBJECT_STORAGE_ENDPOINT: https://obs.example.com
  OBJECT_STORAGE_ACCESS_KEY: replace-me
  OBJECT_STORAGE_SECRET_KEY: replace-me
